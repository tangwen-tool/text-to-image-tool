[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "script2gif"
version = "0.2.0"
description = "An offline Windows desktop application that turns text into animated PNGs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=10.0,<13.0",
    "platformdirs>=4.0,<5.0",
    "PySide6-Essentials>=6.7,<7.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "portalocker>=2.10,<4.0",
    "pydantic>=2.9,<3.0",
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
]
build = [
    "pyinstaller>=6.0,<7.0",
]

[project.scripts]
script2gif = "script2gif.main:main"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP035", "UP045"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["script2gif*"]
